[workspace]
members = [
  "programs/trustlink-escrow",
]
exclude = [
  "programs/trustlink-escrow-backup-*",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[provider]
wallet = "~/.config/solana/id.json"
