[package]
name = "tsn-gpru-proof-contract"
version = "0.1.0"
description = "GPRU one-time DNA key proof program and shared proof contract"
edition = "2021"

[lib]
name = "tsn_gpru_proof_contract"
crate-type = ["lib", "cdylib"]

[features]
default = []
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
curve25519-dalek = { version = "=3.2.1", default-features = false, features = ["u64_backend"] }
solana-program = "=1.18.26"
sha3 = "=0.9.1"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-zk-token-sdk = "=1.18.26"

[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { version = "=0.1.16", features = ["dummy"] }

[workspace]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
