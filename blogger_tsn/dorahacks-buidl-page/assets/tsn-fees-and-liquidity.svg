<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1600 850" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">TSN liquidity and fee model</title><desc id="desc">Liquidity providers fund Creditcoin or future Base vaults before payouts. Fees are paid inside the settlement transaction.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#191814" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#174d3b"/></marker></defs>
<rect width="1600" height="850" fill="#f4f0e8"/><rect x="55" y="55" width="1490" height="740" rx="26" fill="#fffdf8" stroke="#c9c1b2" stroke-width="2"/>
<text x="105" y="125" font-family="Arial" font-size="30" font-weight="800" letter-spacing="3" fill="#191814">LIQUIDITY, PAYOUTS, AND FEES</text><text x="105" y="165" font-family="Georgia" font-size="22" fill="#67635a">Liquidity is prefunded; the settlement fee is paid atomically with the exit.</text>
<g filter="url(#shadow)"><rect x="105" y="260" width="270" height="180" rx="18" fill="#8f6b26"/><rect x="500" y="260" width="290" height="180" rx="18" fill="#194b34"/><rect x="915" y="220" width="290" height="260" rx="18" fill="#05203b"/><rect x="1320" y="260" width="185" height="180" rx="18" fill="#174d3b"/></g>
<path d="M375 350 H500" stroke="#174d3b" stroke-width="6" marker-end="url(#arrow)"/><path d="M790 350 H915" stroke="#174d3b" stroke-width="6" marker-end="url(#arrow)"/><path d="M1205 350 H1320" stroke="#174d3b" stroke-width="6" marker-end="url(#arrow)"/>
<g font-family="Arial" text-anchor="middle"><text x="240" y="320" font-size="25" font-weight="800" fill="#fffdf8">LIQUIDITY PROVIDER</text><text x="240" y="360" font-size="18" fill="#fff7df">Prefunds reserve</text><text x="240" y="390" font-size="18" fill="#fff7df">Earns settlement fees</text><text x="645" y="320" font-size="25" font-weight="800" fill="#fffdf8">CREDITCOIN HUB</text><text x="645" y="360" font-size="18" fill="#d9e6df">Native CTC liquidity</text><text x="645" y="390" font-size="18" fill="#d9e6df">Payout + fee, one tx</text><text x="1060" y="290" font-size="25" font-weight="800" fill="#fffdf8">SETTLEMENT TX</text><text x="1060" y="340" font-size="18" fill="#d7e0e8">Verify signed commitment</text><text x="1060" y="370" font-size="18" fill="#d7e0e8">Pay recipient amount</text><text x="1060" y="400" font-size="18" fill="#d7e0e8">Pay fee recipient</text><text x="1060" y="430" font-size="18" fill="#d7e0e8">Mark settlement consumed</text><text x="1412" y="320" font-size="23" font-weight="800" fill="#fffdf8">RECIPIENT</text><text x="1412" y="360" font-size="18" fill="#d9e6df">Receives net payout</text><text x="1412" y="390" font-size="18" fill="#d9e6df">No separate fee tx</text></g>
<rect x="105" y="555" width="1395" height="130" rx="14" fill="#eee8dc" stroke="#c9c1b2"/><text x="140" y="600" font-family="Arial" font-size="20" font-weight="800" fill="#191814">Direct Creditcoin quote</text><text x="140" y="640" font-family="Georgia" font-size="22" fill="#67635a">Solana network fee + Creditcoin gas + low Creditcoin settlement fee.</text><text x="140" y="675" font-family="Georgia" font-size="22" fill="#67635a">A future Base route adds Base gas and a destination-liquidity fee.</text>
<rect x="490" y="345" width="310" height="55" fill="#194b34"/><text x="645" y="370" text-anchor="middle" font-family="Arial" font-size="18" fill="#d9e6df">Stablecoin liquidity</text><text x="645" y="394" text-anchor="middle" font-family="Arial" font-size="18" fill="#d9e6df">Payout + fee, one tx</text><rect x="100" y="650" width="1405" height="35" fill="#fffdf8"/><text x="140" y="675" font-family="Georgia" font-size="22" fill="#67635a">A future supported EVM route adds destination gas and a destination-liquidity fee.</text>
</svg>
