[workspace]
members = [
  "programs/trustlink-escrow",
]
exclude = [
  "programs/trustlink-escrow-backup-*",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[provider]
cluster = "https://devnet.helius-rpc.com/?api-key=92a02527-5eef-4999-868a-aec60e19f6c3"
wallet = "~/.config/solana/id.json"
