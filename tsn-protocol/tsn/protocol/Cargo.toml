[workspace]
members = [
  "programs/trustlink-escrow",
]
exclude = [
  "programs/trustlink-escrow-backup-*",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[provider]
cluster = "https://devnet.helius-rpc.com/?api-key=bbd5bcd1-ee1b-419e-a226-00455f2e295d"
wallet = "~/.config/solana/id.json"
